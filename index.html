<script>
/* ═══ HELPERS ═══ */
const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanStr=s=>String(s??'').replace(/[<>]/g,''); // sanitização: mata tags antes de entrar no banco
function deepClean(o){if(typeof o==='string')return cleanStr(o);if(Array.isArray(o))return o.map(deepClean);
 if(o&&typeof o==='object'){const r={};Object.keys(o).forEach(k=>r[k]=deepClean(o[k]));return r}return o}
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey=()=>fmt(new Date());
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const weekKey=dk=>{const d=parseD(dk);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const fmtBR=dk=>{const p=dk.split('-');return p[2]+'/'+p[1]};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function lsGet(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('⚠️ Armazenamento cheio — exporte um backup','error')}}
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.innerHTML=msg;$('toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},2800)}
function closeModals(){$$('.modal-overlay').forEach(o=>o.remove())}
function openModal(html){const o=document.createElement('div');o.className='modal-overlay open';o.innerHTML='<div class="modal">'+html+'</div>';
 o.addEventListener('click',e=>{if(e.target===o||e.target.closest('.modal-close'))o.remove()});$('modal-container').appendChild(o);return o}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModals();if($('player-overlay').classList.contains('show'))closePlayer()}});

/* ═══ CONTEÚDO ═══ */
const MODULES=[
 {id:'car',n:'Cardiologia'},{id:'nef',n:'Nefrologia'},{id:'gin',n:'Ginecologia'},{id:'obs',n:'Obstetrícia'},
 {id:'ped',n:'Pediatria'},{id:'prv',n:'Preventiva'},{id:'hep',n:'Hepatologia'},{id:'gas',n:'Gastro'},
 {id:'end',n:'Endócrino'},{id:'hem',n:'Hematologia'},{id:'inf',n:'Infectologia'},{id:'neu',n:'Neurologia'},
 {id:'ort',n:'Ortopedia'},{id:'orl',n:'Otorrino'},{id:'der',n:'Dermatologia'},{id:'pne',n:'Pneumologia'},
 {id:'cir',n:'Cirurgia'},{id:'psi',n:'Psiquiatria'},{id:'reu',n:'Reumatologia'},{id:'oft',n:'Oftalmologia'},
 {id:'leg',n:'Medicina Legal'},{id:'prov',n:'Provas'},{id:'casos',n:'Casos Clínicos'}
];
const MOD=id=>MODULES.find(m=>m.id===id);
const DEMO={
 videos:[{m:'car',t:'[exemplo] Insuficiência Cardíaca',y:'aqz-KE-bpKQ'},{m:'ped',t:'[exemplo] Desidratação na Pediatria',y:'aqz-KE-bpKQ'}],
 apostilas:[{m:'car',t:'[exemplo] Resumo de Cardiologia',u:'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'}]};
let DRIVE=lsGet('cuscuz_med_drive',{videos:[],apostilas:[]}),USING_DEMO=true;
function catalog(){const eV=window.videosData||[],eA=window.apostilasData||[];
 MODULES.forEach(m=>{m.videos=[];m.apostilas=[]});
 [...eV,...DEMO.videos,...DRIVE.videos].forEach(v=>{const m=MOD(v.m);if(m&&v.t&&(v.y||v.u))m.videos.push(v)});
 [...eA,...DEMO.apostilas,...DRIVE.apostilas].forEach(a=>{const m=MOD(a.m);if(m&&a.t&&a.u)m.apostilas.push(a)});
 USING_DEMO=!(eV.length||eA.length||DRIVE.videos.length||DRIVE.apostilas.length)}
const itemsOf=m=>[...m.videos.map(v=>({type:'v',...v})),...m.apostilas.map(a=>({type:'a',...a}))];
const itemKey=it=>it.m+':'+(it.type==='v'?'yt:'+it.y:'pdf:'+it.u);

/* ═══ ESTADO ═══ */
const LS='cuscuz_med_v1';
const DEFDB={plan:null,done:{},skipped:{},exams:{},holidays:{},qweek:{},events:{},habits:{},xp:0,badges:[],streak:0,streakLast:null,
 prep:{routine:{},sessions:{},checklist:[],metaHit:{}}};
let DB=Object.assign(JSON.parse(JSON.stringify(DEFDB)),lsGet(LS,{}));
DB.prep=Object.assign({routine:{},sessions:{},checklist:[],metaHit:{}},DB.prep||{});
DB.events=DB.events||{};DB.habits=DB.habits||{};
let DONE=new Set(lsGet('acv_done',[])),FAV=new Set(lsGet('acv_fav',[])),WRONG=new Set(lsGet('acv_wrong',[]));
let QUIZS=lsGet('acv_quiz',{}),SIMS=lsGet('acv_sims',[]),DECKS=lsGet('acv_decks',[]);
let RESUMOS=lsGet('acv_resumos',{}),FCS=lsGet('acv_fc',[]),FCSRS=lsGet('acv_fc_srs',{});
let FILTER='all',SUBJ=null,CUR_MOD=null,SYNC_USER=null;
let calFilter=new Set(),CALM=new Date();CALM.setDate(1);
const EVC={loja:'#b8c0cc',pessoal:'#e85b7a',facu:'#7c6af0',saude:'#34c97a'}; // loja = prata
const saveCloud=debounce(pushCloud,2500);
function saveDB(sync=true){lsSet(LS,DB);if(sync)saveCloud()}
const addDay=dk=>{const s=new Set(lsGet('acv_days',[]));s.add(dk);lsSet('acv_days',[...s])};

/* ═══ TEMA ═══ */
function applyTheme(){document.documentElement.dataset.theme=lsGet('cuscuz_theme','dark')}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;lsSet('cuscuz_theme',t)}

/* ═══ NAVEGAÇÃO ═══ */
function go(id){$$('.view-section').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');
 $$('.nav-item[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===id));
 document.querySelector('.sidebar').classList.remove('open');document.querySelector('.main').scrollTop=0;
 ({'view-inicio':renderHome,'view-calendario':renderCalendar,'view-cronograma':renderSchedule,'view-semana':renderWeek,
   'view-preparatorio':renderPrep,'view-acervo':renderAcervo,'view-treino':renderDecks,'view-simulados':renderSim}[id]||(()=>{}))()}
function refreshAll(){renderHome();renderCalendar();renderSchedule();renderWeek();renderPrep();renderAcervo();renderDecks();renderSim();renderDash();updateBadges();
 const n=DRIVE.videos.length+DRIVE.apostilas.length;if(n)$('drive-btn-label').textContent='Drive ('+n+')'}

/* ═══ LOGIN / FIREBASE ═══ */
const firebaseConfig={apiKey:"",authDomain:"",databaseURL:"",projectId:""}; // ← sua config aqui (vazio = offline)
let FBDB=null,CLOUD_ON=false;
const hsh=s=>{let x=5381;for(const c of s)x=(x*33+c.charCodeAt(0))>>>0;return x.toString(36)};
function setDot(st){$('cloud-dot').style.background=st==='ok'?'var(--green)':st==='off'?'var(--text-disabled)':'var(--amber)'}
function doLogin(){const u=cleanStr($('login-user').value.trim()),p=$('login-pass').value;
 if(!u||!p){$('login-error').style.display='block';return}
 const users=lsGet('cuscuz_users',{});
 if(users[u]&&users[u]!==hsh(p)){$('login-error').style.display='block';return}
 users[u]=hsh(p);lsSet('cuscuz_users',users);
 SYNC_USER=u;localStorage.setItem('medplan_logged','1');localStorage.setItem('medplan_user',u);
 $('login-error').style.display='none';startApp()}
function logout(){if(confirm('Sair? Os dados continuam salvos neste dispositivo.')){localStorage.removeItem('medplan_logged');location.reload()}}
function payload(){return{db:DB,done:[...DONE],fav:[...FAV],quiz:QUIZS,last:lsGet('acv_last',null),days:lsGet('acv_days',[]),
 sims:SIMS,decks:DECKS,wrong:[...WRONG],resumos:RESUMOS,fc:FCS,fcsrs:FCSRS}}
function pushCloud(){if(!CLOUD_ON||!SYNC_USER)return;setDot('sync');
 FBDB.ref('users/'+SYNC_USER+'/state').set(payload()).then(()=>setDot('ok')).catch(()=>setDot('off'))}
function applyCloud(cl){lsSet(LS,Object.assign(JSON.parse(JSON.stringify(DEFDB)),cl.db||{}));
 lsSet('acv_done',cl.done||[]);lsSet('acv_fav',cl.fav||[]);lsSet('acv_quiz',cl.quiz||{});lsSet('acv_last',cl.last||null);
 lsSet('acv_days',cl.days||[]);lsSet('acv_sims',cl.sims||[]);lsSet('acv_decks',cl.decks||[]);lsSet('acv_wrong',cl.wrong||[]);
 lsSet('acv_resumos',cl.resumos||{});lsSet('acv_fc',cl.fc||[]);lsSet('acv_fc_srs',cl.fcsrs||{})}
function startApp(){
 $('login-screen').style.display='none';$('app-main').style.display='grid';
 catalog();refreshAll();setDot(CLOUD_ON?'ok':'off');
 if(CLOUD_ON&&SYNC_USER){FBDB.ref('users/'+SYNC_USER+'/state').once('value').then(s=>{const cl=s.val();if(!cl)return;
  const cloudXp=cl.db&&cl.db.xp,changed=cloudXp!==DB.xp||(cl.done||[]).length!==DONE.size;
  if(changed&&confirm('Dados encontrados na nuvem para "'+SYNC_USER+'".\nOK = restaurar da nuvem · Cancelar = manter local e sobrescrever nuvem')){
   applyCloud(cl);location.reload()}else if(changed)pushCloud()}).catch(()=>setDot('off'))}}

/* ═══ XP / BADGES ═══ */
const level=()=>Math.floor(DB.xp/100)+1;
const BADGES=[
 {id:'start',i:'🌱',n:'Primeiro passo',c:()=>DB.xp>=5},
 {id:'xp100',i:'💯',n:'100 XP',c:()=>DB.xp>=100},
 {id:'xp500',i:'🔥',n:'500 XP',c:()=>DB.xp>=500},
 {id:'lv5',i:'⭐',n:'Nível 5',c:()=>level()>=5},
 {id:'st3',i:'⚡',n:'Sequência de 3 dias',c:()=>DB.streak>=3},
 {id:'st7',i:'🌪️',n:'Sequência de 7 dias',c:()=>DB.streak>=7},
 {id:'v1',i:'🎬',n:'1ª videoaula',c:()=>[...DONE].some(k=>k.includes(':yt:'))},
 {id:'v10',i:'🎥',n:'10 videoaulas',c:()=>[...DONE].filter(k=>k.includes(':yt:')).length>=10},
 {id:'q1',i:'✏️',n:'1º quiz respondido',c:()=>Object.keys(QUIZS).length>0},
 {id:'q80',i:'🧠',n:'80% num deck (10+ q)',c:()=>Object.values(QUIZS).some(s=>s.t>=10&&s.s/s.t>=.8)},
 {id:'sim',i:'⏱️',n:'1º simulado',c:()=>SIMS.length>0},
 {id:'meta',i:'🎯',n:'Bateu a meta do dia',c:()=>Object.keys(DB.prep.metaHit).length>0},
 {id:'meio',i:'🩺',n:'Meio Médico — 50% do acervo',c:()=>{const t=MODULES.reduce((a,m)=>a+itemsOf(m).length,0);return t>0&&DONE.size>=t/2}},
 {id:'emp',i:'💍',n:'Empreendedor — loja + estudo no mesmo dia',c:()=>Object.keys(DB.events).some(dk=>(DB.events[dk]||[]).some(e=>e.c==='loja')&&Object.keys(DB.done).some(k=>k.split('#')[0]===dk))},
 {id:'tr10',i:'🏋️',n:'10 treinos registrados',c:()=>Object.values(DB.habits).filter(h=>h&&h.treino).length>=10}];
/* Pra usar as artes do grupo: troque i:'emoji' por img:'URL-DA-IMAGEM' (mantenha i:'🏅' como reserva) */
function addXP(n,why){if(n<=0)return;DB.xp+=n;saveDB();toast('+'+n+' XP · '+esc(why),'xp');checkBadges();renderDash()}
function touchStreak(){const t=todayKey();if(DB.streakLast===t)return;DB.streak=(DB.streakLast===addD(t,-1))?DB.streak+1:1;DB.streakLast=t;saveDB();checkBadges()}
function checkBadges(){BADGES.forEach(b=>{if(!DB.badges.includes(b.id)&&b.c()){DB.badges.push(b.id);saveDB(false);
 $('reward-emoji').textContent=b.i;$('reward-title').textContent='Badge desbloqueada!';$('reward-sub').textContent=b.n;
 $('reward-xp').textContent='XP total: '+DB.xp;$('reward-overlay').classList.add('open');confetti()}})}
function confetti(){const c=$('confetti-canvas'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#f5a623','#34c97a','#7c6af0','#e85b7a','#00c8a8'];
 const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:4+Math.random()*5,r:Math.random()*6.28,col:cols[Math.floor(Math.random()*5)]}));
 let f=0;(function loop(){f++;x.clearRect(0,0,c.width,c.height);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
  f<180?requestAnimationFrame(loop):x.clearRect(0,0,c.width,c.height)})()}

/* ═══ PLANO ═══ */
function openPlanModal(){
 const chips=MODULES.map(m=>'<span class="chip" data-pm="'+m.id+'" onclick="this.classList.toggle(\'active\')">'+m.n+'</span>').join('');
 openModal('<div class="modal-title">⚡ Gerar plano de estudos<button class="modal-close"><i class="ph ph-x"></i></button></div>'
 +'<div class="form-group"><label class="form-label">Nome da prova</label><input id="pl-name" placeholder="Ex: ENARE"></div>'
 +'<div class="form-row"><div class="form-group"><label class="form-label">Início</label><input id="pl-start" type="date" value="'+todayKey()+'"></div>'
 +'<div class="form-group"><label class="form-label">Data da prova</label><input id="pl-date" type="date"></div></div>'
 +'<div class="form-group"><label class="form-label">Matérias</label><div class="chips">'+chips+'</div></div>'
 +'<div class="form-group"><label class="form-label">Intensidade</label><select id="pl-int"><option value="1">Leve — 1 tópico/dia</option><option value="2" selected>Normal — 2 tópicos/dia</option><option value="3">Intenso — 3 tópicos/dia</option></select></div>'
 +'<div class="form-actions"><button class="btn-outline" onclick="closeModals()">Cancelar</button><button class="btn-primary" onclick="generatePlan()">Gerar plano</button></div>')}
function generatePlan(){
 const name=cleanStr($('pl-name').value.trim()),start=$('pl-start').value,end=$('pl-date').value,int=+$('pl-int').value;
 const subs=$$('.chip[data-pm].active').map(c=>c.dataset.pm);
 if(!name||!start||!end||!subs.length){toast('Preencha todos os campos e escolha matérias','error');return}
 if(end<=start){toast('A prova deve ser depois do início','error');return}
 if(DB.plan&&DB.plan.items&&DB.plan.items.length&&!confirm('Isso substitui o plano atual. Continuar?'))return;
 const per=subs.map(id=>({id,items:itemsOf(MOD(id)).map(i=>i.t)}));
 const days=[];let d=start;while(d<end){days.push(d);d=addD(d,1)}
 const items=[];let idx=0;
 days.forEach(day=>{for(let k=0;k<int;k++){
  let pick=null;for(let r=0;r<per.length&&!pick;r++){const p=per[(idx+r)%per.length];if(p.items.length)pick=p}
  if(pick){items.push({d:day,s:pick.id,t:pick.items.shift()});idx=(idx+1)%per.length}
  else{const s=subs[idx%subs.length];items.push({d:day,s,t:'Revisão — '+MOD(s).n});idx++}}});
 DB.plan={exam:{d:end,name},items};DB.exams[end]={name};DB.done={};DB.skipped={};
 saveDB();closeModals();toast('Plano gerado: '+items.length+' tópicos até a prova','success');confetti();checkBadges();refreshAll()}
function planOn(dk){if(!DB.plan)return[];return DB.plan.items.map((it,ix)=>({ix,...it})).filter(i=>i.d===dk)}
function setItem(dk,ix,field){const k=dk+'#'+ix;
 if(field==='done'){if(DB.done[k])delete DB.done[k];else{DB.done[k]=1;addXP(5,'tópico concluído');touchStreak();addDay(dk);checkMeta()}}
 else{DB.skipped[k]?delete DB.skipped[k]:DB.skipped[k]=1}
 saveDB();refreshLight();if(document.querySelector('.modal-overlay')){closeModals();openDay(dk)}}
function refreshLight(){renderDash();renderCalendar();renderSchedule();renderWeek();renderHome();updateBadges()}
function addExam(dk){const n=cleanStr(prompt('Nome da prova:')||'');if(!n)return;DB.exams[dk]={name:n};saveDB();closeModals();openDay(dk);refreshLight()}
function delExam(dk){delete DB.exams[dk];saveDB();closeModals();openDay(dk);refreshLight()}
function toggleHoliday(dk){DB.holidays[dk]?delete DB.holidays[dk]:DB.holidays[dk]=1;saveDB();closeModals();openDay(dk);refreshLight()}
function toggleCalFilter(s){calFilter.has(s)?calFilter.delete(s):calFilter.add(s);renderCalendar()}
function changeMonth(n){CALM.setMonth(CALM.getMonth()+n);renderCalendar()}
function goToday(){CALM=new Date();CALM.setDate(1);renderCalendar()}

/* ═══ CALENDÁRIO (híbrido: estudos + eventos + treino) ═══ */
function renderCalendar(){
 const y=CALM.getFullYear(),mo=CALM.getMonth();
 $('month-label').textContent=CALM.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const subs=[...new Set((DB.plan?DB.plan.items:[]).map(i=>i.s))];
 $('subject-chips').innerHTML=subs.map(s=>'<span class="chip'+(calFilter.has(s)?' active':'')+'" onclick="toggleCalFilter(\''+s+'\')">'+esc(MOD(s)?MOD(s).n:s)+'</span>').join('');
 const start=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),t=todayKey();
 let html='';for(let i=0;i<start;i++)html+='<div class="day other"></div>';
 for(let d=1;d<=dim;d++){
  const dk=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const items=planOn(dk).filter(i=>!calFilter.size||calFilter.has(i.s));
  const evs=DB.events[dk]||[],hb=DB.habits[dk]||{};
  const ex=DB.exams[dk],ho=DB.holidays[dk];
  let cls='day'+(dk===t?' today':'')+(ho?' holiday':'')+(ex?' exam':'')+(!ex&&!ho&&items.length?' study':'');
  const label=ex?esc(ex.name):(ho?'Feriado':'');
  const allDone=items.length&&items.every(i=>DB.done[dk+'#'+i.ix]);
  const chips=[...items.slice(0,3).map(i=>'<span class="day-chip'+(DB.done[dk+'#'+i.ix]?' done':'')+'">'+esc(i.t)+'</span>'),
   ...evs.map(e=>'<span class="day-chip" style="background:'+EVC[e.c]+';color:#0b0d11">'+esc(e.t)+'</span>')].slice(0,3).join('');
  html+='<div class="'+cls+'" onclick="openDay(\''+dk+'\')"><div class="day-bar"></div><div class="dnum">'+d+'</div>'
  +(label?'<div class="day-label">'+label+'</div>':'')+'<div class="day-chips">'+chips+'</div>'
  +((hb.treino||hb.macros)?'<div class="hab-ico">'+(hb.treino?'🏋️':'')+(hb.macros?'🍽️':'')+'</div>':'')
  +(allDone?'<div class="day-check"><i class="ph ph-check-bold"></i></div>':'')+'</div>'}
 $('cal-grid').innerHTML=html}
function openDay(dk){
 const items=planOn(dk),ex=DB.exams[dk],evs=DB.events[dk]||[],hb=DB.habits[dk]||{},p=dk.split('-');
 let body=ex?'<div class="week-item"><span class="sdot" style="background:var(--amber)"></span><b>📝 '+esc(ex.name)+'</b><button class="btn-outline btn-sm" style="margin-left:auto" onclick="delExam(\''+dk+'\')">Remover</button></div>':'';
 body+=evs.map((e,i)=>'<div class="week-item"><span class="sdot" style="background:'+EVC[e.c]+'"></span><span class="week-item-topic">'+esc(e.t)+'</span><span class="fc-meta">'+e.c+'</span><button class="btn-icon" style="width:28px;height:28px" onclick="delEvent(\''+dk+'\','+i+')"><i class="ph ph-x"></i></button></div>').join('');
 body+=items.length?items.map(i=>{const k=dk+'#'+i.ix,done=DB.done[k];
  return '<div class="week-item"><span class="week-item-code">'+fmtBR(dk)+'</span><span class="sdot" style="background:var(--violet)"></span><span class="week-item-topic'+(done?' completed':'')+'">'+esc(i.t)+'</span>'
  +'<button class="check-btn'+(done?' checked':'')+'" onclick="setItem(\''+dk+'\','+i.ix+',\'done\')"><i class="ph ph-check-bold"></i></button>'
  +'<button class="skip-btn" title="Pular" onclick="setItem(\''+dk+'\','+i.ix+',\'skip\')"><i class="ph ph-skip-forward"></i></button></div>'}).join('')
 :(evs.length?'':'<div style="color:var(--text-muted);font-size:13px">Nada planejado para este dia.</div>');
 body+='<div class="form-actions" style="justify-content:flex-start;flex-wrap:wrap">'
 +'<button class="btn-outline" onclick="addEvent(\''+dk+'\')">🏷️ Evento</button>'
 +'<button class="btn-outline" onclick="toggleHabit(\''+dk+'\',\'treino\')">🏋️ '+(hb.treino?'Treino ✓':'Treino')+'</button>'
 +'<button class="btn-outline" onclick="toggleHabit(\''+dk+'\',\'macros\')">🍽️ '+(hb.macros?'Macros ✓':'Macros')+'</button>'
 +'<button class="btn-outline" onclick="addExam(\''+dk+'\')">📝 Prova</button>'
 +'<button class="btn-outline" onclick="toggleHoliday(\''+dk+'\')">🏖️ '+(DB.holidays[dk]?'Remover feriado':'Feriado')+'</button></div>';
 openModal('<div class="modal-title">📅 '+p[2]+'/'+p[1]+'/'+p[0]+'<button class="modal-close"><i class="ph ph-x"></i></button></div>'+body)}
function addEvent(dk){openModal('<div class="modal-title">🏷️ Evento — '+fmtBR(dk)+'<button class="modal-close"><i class="ph ph-x"></i></button></div>'

function renderSchedule(){
 const el=$('schedule-view');
 if(!DB.plan||!DB.plan.items.length){el.innerHTML='<div style="color:var(--text-muted);padding:40px 0">Nenhum plano ativo. Clique em <b>⚡ Planejar</b> no topo para gerar um cronograma.</div>';return}
 const weeks={};DB.plan.items.forEach((it,ix)=>{const wk=weekKey(it.d);(weeks[wk]=weeks[wk]||[]).push({ix,...it})});
 const tot=DB.plan.items.length,dn=DB.plan.items.filter(i=>DB.done[i.d+'#'+i.ix]).length;
 el.innerHTML='<div class="week-target"><b>📌 '+esc(DB.plan.exam.name)+'</b><span style="color:var(--text-muted);font-family:var(--font-mono);font-size:12px">prova: '+fmtBR(DB.plan.exam.d)+' · '+Math.max(0,diffDays(todayKey(),DB.plan.exam.d))+' dias · '+dn+'/'+tot+' concluídos</span>'
 +'<div class="progress-bar" style="flex:1;min-width:120px"><div class="progress-fill" style="width:'+pct(dn,tot)+'%"></div></div></div>'
 +Object.keys(weeks).sort().map((wk,wi)=>{const arr=weeks[wk],d=arr.filter(i=>DB.done[i.d+'#'+i.ix]).length;
  return '<div class="week-card"><div class="week-hdr" onclick="const b=this.nextElementSibling;b.style.display=b.style.display===\'none\'?\'block\':\'none\'">'
  +'<span class="week-num">S'+(wi+1)+'</span><span class="week-dates">'+fmtBR(wk)+' – '+fmtBR(addD(wk,6))+'</span>'
  +'<span class="week-progress">'+d+'/'+arr.length+'</span></div>'
  +'<div style="display:'+(weekKey(todayKey())===wk?'block':'none')+'">'+arr.map(itemRow).join('')+'</div></div>'}).join('')}
function renderWeek(){
 const wk=weekKey(todayKey());
 const items=DB.plan?DB.plan.items.map((it,ix)=>({ix,...it})).filter(i=>weekKey(i.d)===wk):[];
 const q=DB.qweek[wk]||{goal:100,done:0,hit:false};
 const dn=items.filter(i=>DB.done[i.d+'#'+i.ix]).length;
 $('week-view').innerHTML='<div class="week-target"><div style="flex:1"><div class="dash-title">Meta de questões da semana</div>'
 +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><input class="week-q-input" id="wk-goal" type="number" min="0" value="'+q.goal+'">'
 +'<button class="btn-outline btn-sm" onclick="saveWkGoal()">salvar meta</button>'
 +'<button class="btn-outline btn-sm" onclick="addWkQ(10)">+10 questões</button>'
 +'<button class="btn-outline btn-sm" onclick="addWkQ(25)">+25</button>'
 +'<b style="font-family:var(--font-mono)">'+q.done+' / '+q.goal+'</b></div>'
 +'<div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:'+pct(q.done,q.goal)+'%"></div></div></div></div>'
 +'<div class="week-card"><div class="week-hdr" style="cursor:default"><span class="week-num">Semana atual</span>'
 +'<span class="week-dates">'+fmtBR(wk)+' – '+fmtBR(addD(wk,6))+'</span><span class="week-progress">'+dn+'/'+items.length+' tópicos</span></div>'
 +(items.length?items.map(itemRow).join(''):'<div class="week-item" style="color:var(--text-muted)">Semana sem tópicos planejados.</div>')+'</div>'}
function saveWkGoal(){const wk=weekKey(todayKey());const q=DB.qweek[wk]||{done:0,hit:false};q.goal=Math.max(0,+$('wk-goal').value||0);DB.qweek[wk]=q;saveDB();renderWeek()}
function addWkQ(n){const wk=weekKey(todayKey());const q=DB.qweek[wk]||{goal:100,done:0,hit:false};q.done+=n;
 if(!q.hit&&q.goal>0&&q.done>=q.goal){q.hit=true;addXP(15,'meta de questões!');confetti()}
 DB.qweek[wk]=q;saveDB();touchStreak();renderWeek()}

const DOWS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
let PT={running:false,t0:null,acc:0,tick:null,pomo:null};
const elapsed=()=>PT.acc+(PT.running?Math.floor((Date.now()-PT.t0)/1000):0);
function prepTimerToggle(){
 if(!PT.running){PT.running=true;PT.t0=Date.now();$('prep-timer-btn').innerHTML='<i class="ph ph-pause"></i> Pausar';$('prep-timer').classList.add('running');PT.tick=setInterval(updPT,1000)}
 else{PT.acc=elapsed();PT.running=false;$('prep-timer-btn').innerHTML='<i class="ph ph-play"></i> Retomar';$('prep-timer').classList.remove('running');clearInterval(PT.tick)}
 updPT()}
function updPT(){const s=elapsed();
 $('prep-timer').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');
 if(PT.pomo)pomoTick(s)}
function prepTimerStop(){
 const min=Math.floor(elapsed()/60);
 clearInterval(PT.tick);PT={running:false,t0:null,acc:0,tick:null,pomo:PT.pomo};
 $('prep-timer').classList.remove('running');$('prep-timer-btn').innerHTML='<i class="ph ph-play"></i> Iniciar';$('prep-timer').textContent='00:00:00';
 if(min>=1){const t=todayKey();DB.prep.sessions[t]=(DB.prep.sessions[t]||0)+min;saveDB();
  addXP(min>=25?3:1,min+' min de estudo');touchStreak();checkMeta();renderPrep()}}
function prepPomoToggle(on){$('prep-pomo-config').style.display=on?'flex':'none';$('prep-pomo-phase').style.display=on?'block':'none';
 if(on){PT.pomo={phase:'focus',cycles:0,base:elapsed(),len:(+($('prep-pomo-focus').value)||25)*60};updPT()}else PT.pomo=null}
function prepPomoCfg(){if(PT.pomo){PT.pomo.len=(PT.pomo.phase==='focus'?(+($('prep-pomo-focus').value)||25):(+($('prep-pomo-brk').value)||5))*60;PT.pomo.base=elapsed()}}
function pomoTick(total){const p=PT.pomo,left=Math.max(0,p.len-(total-p.base));
 $('prep-pomo-chip').textContent=(p.phase==='focus'?'🍅 Foco':'☕ Pausa')+' · '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 $('prep-pomo-chip').className='chip '+(p.phase==='focus'?'pomo-chip-focus':'pomo-chip-break');
 $('prep-pomo-cycles').textContent=p.cycles+' ciclos';
 if(left<=0){
  if(p.phase==='focus'){p.phase='break';p.len=(+($('prep-pomo-brk').value)||5)*60;toast('Pausa! Levante e beba água 💧','success')}
  else{p.phase='focus';p.cycles++;p.len=(+($('prep-pomo-focus').value)||25)*60;toast('De volta ao foco 🍅','success');addXP(2,'ciclo pomodoro')}
  p.base=total}}

 $('prep-routine').innerHTML=[1,2,3,4,5,6,0].map(d=>'<div class="routine-row"><span>'+DOWS[d]+'</span><input type="number" min="0" max="960" value="'+(DB.prep.routine[d]||0)+'" onchange="setRoutine('+d+',this.value)"><span style="font-size:11px;color:var(--text-muted)">min</span></div>').join('');

 const total=Object.values(DB.prep.sessions).reduce((a,b)=>a+b,0);

  rf='<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">'+(dd>=0?'<b style="color:var(--rose);font-size:22px;font-family:var(--font-serif)">'+dd+'</b> dias para <b>'+esc(DB.plan.exam.name)+'</b>':'Prova realizada ✅')+'</div>'
  +'<div class="prep-meta-bar"><div class="prep-meta-fill" style="width:'+pct(dn,tot)+'%"></div></div>'
  +'<div class="prep-meta-label"><span>Plano concluído</span><span>'+dn+'/'+tot+'</span></div>'}
 $('prep-finalline').innerHTML=rf;
 $('prep-checklist').innerHTML=(DB.prep.checklist||[]).map((c,i)=>'<div class="check-item'+(c.on?' on':'')+'" onclick="prepToggleItem('+i+')"><span class="check-btn'+(c.on?' checked':'')+'"><i class="ph ph-check-bold"></i></span><span style="flex:1">'+esc(c.t)+'</span><i class="ph ph-x" style="color:var(--text-muted)" onclick="event.stopPropagation();prepDelItem('+i+')"></i></div>').join('')
 ||'<div style="font-size:12px;color:var(--text-muted)">Nada aqui ainda.</div>'}

 btns.forEach((b,j)=>{b.classList.add('locked');if(j===q.ans)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});

function openImport(){

 +'<div class="form-group"><label class="form-label">Matéria</label><select id="imp-subj">'+MODULES.map(m=>'<option value="'+m.id+'">'+m.n+'</option>').join('')+'</select></div>'
 +'<div class="form-group"><label class="form-label">Cole as questões (texto ou JSON)</label><textarea class="imp-textarea" id="imp-txt" placeholder="P: enunciado\na) opção 1\nb) opção 2\nc) opção 3\nd) opção 4\nR: a\nE: comentário"></textarea></div>'
 +'<div style="font-size:11px;color:var(--text-muted)">Separe questões por linha em branco. JSON: [{"q":"","opts":["","","",""],"ans":0,"exp":""}]</div>'
 +'<div class="form-actions"><button class="btn-outline" onclick="previewImport()">Verificar</button><button class="btn-primary" onclick="saveImport()">Importar</button></div>')}
function parseQs(txt){txt=String(txt||'').trim();
 if(txt[0]==='['){try{return JSON.parse(txt).filter(q=>q.q&&q.opts&&q.opts.length>=2)}catch(e){return[]}}
 const out=[];
 txt.split(/\n\s*\n/).forEach(b=>{let q='',opts=[],ans=-1,exp='';
  b.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
   if(/^p[:\-]/i.test(l))q=l.replace(/^p[:\-]\s*/i,'');
   else if(/^[a-e][\)\.\-]\s/i.test(l))opts.push(l.replace(/^[a-e][\)\.\-]\s*/i,''));
   else if(/^r[:\-]/i.test(l))ans='abcde'.indexOf((l.replace(/^r[:\-]\s*/i,'')[0]||'').toLowerCase());
   else if(/^e[:\-]/i.test(l))exp=l.replace(/^e[:\-]\s*/i,'');
   else if(q&&!opts.length)q+=' '+l});
  if(q&&opts.length>=2&&ans>=0)out.push({q,opts,ans,exp})});
 return out}
function previewImport(){const qs=parseQs($('imp-txt').value);toast(qs.length+' questões válidas encontradas',qs.length?'success':'error')}
function saveImport(){const qs=deepClean(parseQs($('imp-txt').value));
 if(!qs.length){toast('Nada para importar — verifique o formato','error');return}
 const s=$('imp-subj').value;DECKS.push({id:'d'+Date.now(),subj:s,name:MOD(s).n,qs});lsSet('acv_decks',DECKS);
 closeModals();renderDecks();checkBadges();addXP(Math.min(qs.length,20),'banco ampliado');
 toast(qs.length+' questões importadas em '+MOD(s).n,'success')}

function buildFCList(){

 DECKS.forEach(d=>d.qs.forEach(q=>{
  const back=(q.opts&&q.opts[q.ans]!=null?'R: '+q.opts[q.ans]:'')+(q.exp?'\n'+q.exp:'');
  out.push({f:q.q,b:back||'—',s:d.subj})}));
 FCS.forEach(c=>out.push({f:c.f,b:c.b,s:c.s||'x'}));
 return out}
const fcKey=c=>'fc:'+hsh((c.f||'')+'::'+(c.b||''));
function fcState(k){return FCSRS[k]||(FCSRS[k]={d:todayKey(),iv:0,e:2.5})}
function fcDue(list){const t=todayKey();return list.filter(c=>fcState(fcKey(c)).d<=t)}

let FCR=null;

 if(!list.length){toast('Nada para revisar hoje 🎉','success');return}
 FCR={list:shuffle(list),i:0,shown:false};
 $('quiz-list-screen').style.display='none';$('quiz-runner-screen').style.display='block';renderFC()}
function renderFC(){const r=FCR;if(!r||r.i>=r.list.length)return finishFC();
 const c=r.list[r.i],st=fcState(fcKey(c));
 $('quiz-runner').innerHTML='<div><div class="quiz-progress-label"><span>Card '+(r.i+1)+' / '+r.list.length+'</span><span>revisão espaçada</span></div>'
 +'<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:'+pct(r.i,r.list.length)+'%"></div></div></div>'
 +'<div class="quiz-question-card"><div class="fc-meta">'+esc(MOD(c.s)?MOD(c.s).n:'Card personalizado')+' · voltar em: '+st.iv+'d · facilidade: '+st.e.toFixed(2)+'</div>'
 +'<div class="quiz-question-text">'+esc(c.f)+'</div>'
 +(r.shown?'<div class="quiz-explanation show" style="white-space:pre-wrap">'+esc(c.b)+'</div>'
   +'<div class="srs-btns"><button class="fc-btn" style="color:var(--rose)" onclick="gradeFC(0)">Errei</button>'
   +'<button class="fc-btn" style="color:var(--amber)" onclick="gradeFC(1)">Difícil</button>'
   +'<button class="fc-btn" style="color:var(--green)" onclick="gradeFC(2)">Boa</button>'
   +'<button class="fc-btn" style="color:var(--teal)" onclick="gradeFC(3)">Fácil</button></div>'
  :'<button class="btn-primary" style="margin-top:14px" onclick="FCR.shown=true;renderFC()"><i class="ph ph-eye"></i> Mostrar resposta</button>')
 +'</div><div class="quiz-nav-row"><button class="btn-outline" onclick="quitFC()">Sair</button></div>'}
function gradeFC(g){const r=FCR,c=r.list[r.i],st=fcState(fcKey(c));r.i++;
 if(g===0){st.iv=0;st.e=Math.max(1.3,st.e-.2);st.d=todayKey();r.list.push(c)}
 else if(g===1){st.iv=Math.max(1,Math.round((st.iv||1)*1.2));st.e=Math.max(1.3,st.e-.15)}
 else if(g===2){st.iv=st.iv<1?1:Math.round(st.iv*st.e)}
 else{st.iv=st.iv<1?2:Math.round(st.iv*st.e*1.3);st.e=Math.min(3.2,st.e+.05)}
 if(g>0){st.iv=Math.min(st.iv,365);st.d=addD(todayKey(),st.iv)}
 addXP(g===3?2:1,'revisão espaçada');touchStreak();saveFC();renderFC()}

function setFilter(f){FILTER=f;$$('.nav-item[data-filter]').forEach(n=>n.classList.toggle('active',n.dataset.filter===f));renderAcervo()}
function clearSubject(){SUBJ=null;CUR_MOD=null;$$('#subject-nav .nav-item').forEach(n=>n.classList.remove('active'));renderAcervo()}
function buildSubjectNav(){$('subject-nav').innerHTML=MODULES.map(m=>'<div class="nav-item" data-subj="'+m.id+'" onclick="pickSubject(\''+m.id+'\',this)"><i class="ph ph-bookmark"></i>'+m.n+'<span class="nav-badge" id="sn-'+m.id+'">0</span></div>').join('')}
function pickSubject(s,el){SUBJ=s;CUR_MOD=null;$$('#subject-nav .nav-item').forEach(n=>n.classList.toggle('active',n===el));renderAcervo()}
function updateBadges(){let tot=0,dn=0;
 MODULES.forEach(m=>{const its=itemsOf(m),d=its.filter(i=>DONE.has(itemKey(i))).length;tot+=its.length;dn+=d;
  const b=$('sn-'+m.id);if(b)b.textContent=its.length?d+'/'+its.length:'0'});
 $('badge-total').textContent=tot;$('badge-done').textContent=dn;$('badge-pending').textContent=tot-dn}

/* ═══ EXPORT / IMPORT ═══ */
function exportData(){
 const payload={v:2,app:'cuscuz-med',exported:new Date().toISOString(),db:DB,done:[...DONE],fav:[...FAV],quiz:QUIZS,
  last:lsGet('acv_last',null),days:lsGet('acv_days',[]),sims:SIMS,decks:DECKS,wrong:[...WRONG],
  drive:DRIVE,users:lsGet('cuscuz_users',{}),resumos:RESUMOS,fc:FCS,fcsrs:FCSRS};
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));
 a.download='cuscuz-med-backup-'+todayKey()+'.json';a.click();toast('Backup exportado ✅','success')}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const p=deepClean(JSON.parse(r.result));
  if(!p.db){toast('Arquivo inválido','error');return}
  if(!confirm('Substituir todos os dados locais por este backup?'))return;
  lsSet(LS,p.db);lsSet('acv_done',p.done||[]);lsSet('acv_fav',p.fav||[]);lsSet('acv_quiz',p.quiz||{});
  lsSet('acv_last',p.last||null);lsSet('acv_days',p.days||[]);lsSet('acv_sims',p.sims||[]);
  lsSet('acv_decks',p.decks||[]);lsSet('acv_wrong',p.wrong||[]);lsSet('cuscuz_med_drive',p.drive||{videos:[],apostilas:[]});
  lsSet('acv_resumos',p.resumos||{});lsSet('acv_fc',p.fc||[]);lsSet('acv_fc_srs',p.fcsrs||{});
  if(p.users)lsSet('cuscuz_users',p.users);
  toast('Backup restaurado! Recarregando...','success');setTimeout(()=>location.reload(),700)}catch(e){toast('Arquivo inválido','error')}};
 r.readAsText(f);ev.target.value=''}
